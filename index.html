<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSG.web</title>
    <link rel="stylesheet" href="Style.css">
  </head>
  <body>
    <div class="repo-link">
      <a href="https://github.com/Tinotsiga/TSG.-web" target="_blank">View on GitHub</a>
    </div>

    <form action="#" method="post">

      <h1>TSG.connect</h1>
      <h2>Log in</h2>

      <label for="username">Username:</label>
      <input type="text" name="username" id="username"><br><br>

      <label for="emailid">Email:</label>
      <input type="text" name="email" id="emailid"><br><br>

      <label for="tel">Phone:</label>
      <input type="tel" name="tel" id="tel"><br><br>

      <label>Gender:</label>
      Male <input type="radio" name="gender" value="male" id="male"><tag>
        <!--Tab to edit-->
      </tag>
      Female <input type="radio" name="gender" value="female" id="female"><br><br>

      <label for="password">Password:</label>
      <input type="password" name="password" id="password"><br><br>

      <input type="submit" value="Submit" id="Submit" name="Submit">

    </form>
    <script src="script.js"></script>
  </body>
</html>
